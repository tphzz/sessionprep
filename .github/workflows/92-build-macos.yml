name: 92 Helper - macOS architectures
'on':
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sha:
        required: true
        type: string
      debug:
        required: true
        type: boolean
      notarize_macos:
        required: true
        type: boolean
      architecture:
        required: false
        type: string
        default: both
    secrets:
      MACOS_DEV_ID_CERT_NAME:
        required: false
permissions:
  contents: read
jobs:
  macos:
    runs-on:
    - self-hosted
    - macOS
    - ARM64
    concurrency:
      group: sessionprep-apple-silicon-host
      cancel-in-progress: false
      queue: max
    timeout-minutes: 360
    env:
      # Stable folders keep ccache hits across runs; checkout resets them.
      SOURCE_DIR: build-macos
      BUILD_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.sha }}
      DEBUG_BUILD: ${{ inputs.debug }}
      NOTARIZE_MACOS: ${{ inputs.notarize_macos }}
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
    - name: Checkout exact build commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        path: ${{ env.SOURCE_DIR }}
    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      with:
        # Self-hosted runners keep uv's local cache. The remote cache only held
        # a pruned copy, and saving it pruned downloaded wheels locally.
        enable-cache: false
    - name: Verify Xcode and Rosetta
      shell: bash
      env:
        SELECTED_ARCH: ${{ inputs.architecture }}
      run: |
        set -euo pipefail
        case "$SELECTED_ARCH" in both|arm64|x64) ;; *) echo 'Invalid macOS architecture selection' >&2; exit 2;; esac
        xcodebuild -version
        if [[ "$SELECTED_ARCH" != "arm64" ]]; then /usr/bin/arch -x86_64 /usr/bin/true; fi
    - name: Resolve selected macOS Python interpreters
      id: macos-python
      shell: bash
      env:
        SELECTED_ARCH: ${{ inputs.architecture }}
      run: |
        set -euo pipefail
        case "$SELECTED_ARCH" in
          both) architectures=(arm64 x64) ;;
          arm64|x64) architectures=("$SELECTED_ARCH") ;;
          *) echo 'Invalid macOS architecture selection' >&2; exit 2 ;;
        esac
        bootstrap_python=""
        for architecture in "${architectures[@]}"; do
          case "$architecture" in
            arm64)
              request=cpython-3.13-macos-aarch64-none
              override="${CI_PYTHON_MACOS_ARM64:-${CI_PYTHON:-}}" ;;
            x64)
              request=cpython-3.13-macos-x86_64-none
              override="${CI_PYTHON_MACOS_X64:-${CI_PYTHON:-}}" ;;
          esac
          if [[ -n "$override" ]]; then
            python_path="$(uv python find --no-project --no-python-downloads "$override")"
          else
            uv python install --no-bin "$request"
            python_path="$(uv python find --managed-python --no-project "$request")"
          fi
          "$python_path" - "$architecture" <<'PY'
        import platform, sys
        expected = {"arm64": "arm64", "x64": "x86_64"}[sys.argv[1]]
        actual = platform.machine()
        version = ".".join(map(str, sys.version_info[:3]))
        print(f"Selected Python: {sys.executable} ({version}, {actual}); expected {expected}")
        if (platform.system() != "Darwin" or platform.python_implementation() != "CPython"
                or sys.version_info[:2] != (3, 13) or actual != expected):
            raise SystemExit(f"macos-{sys.argv[1]} requires CPython 3.13 ({expected}); selected {sys.executable} is {version} ({actual})")
        PY
          printf '%s-python=%s\n' "$architecture" "$python_path" >> "$GITHUB_OUTPUT"
          if [[ -z "$bootstrap_python" ]]; then
            bootstrap_python="$python_path"
            printf 'bootstrap-python=%s\n' "$bootstrap_python" >> "$GITHUB_OUTPUT"
            printf 'MACOS_BOOTSTRAP_PYTHON=%s\n' "$bootstrap_python" >> "$GITHUB_ENV"
          fi
        done
    - name: Verify persistent signing
      shell: bash
      env:
        MACOS_DEV_ID_CERT_NAME: ${{ secrets.MACOS_DEV_ID_CERT_NAME }}
        PYTHON_INSTALL: ${{ steps.macos-python.outputs.bootstrap-python }}
      run: |
        set -euo pipefail
        cd "$SOURCE_DIR"
        "$PYTHON_INSTALL" packaging/macos/ci_signing.py prepare
    - name: Build and package macOS arm64
      if: ${{ inputs.architecture != 'x64' }}
      shell: bash
      env:
        SOURCE_DIR: ${{ env.SOURCE_DIR }}
        UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/env-macos-arm64
        BUILD_PLATFORM: macos-arm64
        PYTHON_INSTALL: ${{ steps.macos-python.outputs.arm64-python }}
      run: |
        set -euo pipefail
        cd "$SOURCE_DIR"
        python_path="$PYTHON_INSTALL"
        uv sync --frozen --extra cli --extra gui --python "$python_path"
        build_args=(--platform "$BUILD_PLATFORM" --version "$BUILD_VERSION" --sha "$SOURCE_SHA")
        if [[ "$DEBUG_BUILD" == "true" ]]; then build_args+=(--debug); fi
        uv run --frozen --python "$python_path" python packaging/github/build.py compile "${build_args[@]}"
        uv run --frozen --python "$python_path" python packaging/github/build.py package "${build_args[@]}" --output artifacts
    - name: Upload platform artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: sessionprep-macos-arm64-${{ inputs.debug && 'debug' || 'release' }}
        path: ${{ env.SOURCE_DIR }}/artifacts
        if-no-files-found: error
      if: ${{ inputs.architecture != 'x64' }}
    - name: Checkout exact build commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        path: ${{ env.SOURCE_DIR }}-x64
      if: ${{ inputs.architecture != 'arm64' }}
    - name: Build and package macOS x64
      if: ${{ inputs.architecture != 'arm64' }}
      shell: bash
      env:
        SOURCE_DIR: ${{ env.SOURCE_DIR }}-x64
        UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/env-macos-x64
        BUILD_PLATFORM: macos-x64
        PYTHON_INSTALL: ${{ steps.macos-python.outputs.x64-python }}
      run: |
        set -euo pipefail
        cd "$SOURCE_DIR"
        python_path="$PYTHON_INSTALL"
        uv sync --frozen --extra cli --extra gui --python "$python_path"
        build_args=(--platform "$BUILD_PLATFORM" --version "$BUILD_VERSION" --sha "$SOURCE_SHA")
        if [[ "$DEBUG_BUILD" == "true" ]]; then build_args+=(--debug); fi
        uv run --frozen --python "$python_path" python packaging/github/build.py compile "${build_args[@]}"
        uv run --frozen --python "$python_path" python packaging/github/build.py package "${build_args[@]}" --output artifacts
    - name: Upload platform artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: sessionprep-macos-x64-${{ inputs.debug && 'debug' || 'release' }}
        path: ${{ env.SOURCE_DIR }}-x64/artifacts
        if-no-files-found: error
      if: ${{ inputs.architecture != 'arm64' }}
