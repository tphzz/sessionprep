name: 00 Full - All Platforms
run-name: ${{ github.workflow }} | ${{ github.ref_name }} | ${{ inputs.debug && 'Debug' || 'Release' }}
'on':
  workflow_dispatch:
    inputs:
      debug:
        description: Debug diagnostics (artifacts only)
        required: false
        default: false
        type: boolean
      notarize_macos:
        description: Notarize macOS (optional for every ref/configuration)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: sessionprep-all-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  checks:
    uses: ./.github/workflows/90-build-checks.yml
    with:
      publish_drafts: ${{ !inputs.debug }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
  linux-x64:
    needs:
    - checks
    uses: ./.github/workflows/91-build-platform.yml
    with:
      platform: linux-x64
      runner_labels: '["self-hosted", "Linux", "X64", "jammy", "docker"]'
      resource_group: sessionprep-x64-host
      version: ${{ needs.checks.outputs.version }}
      sha: ${{ needs.checks.outputs.sha }}
      debug: ${{ inputs.debug }}
  windows-x64:
    needs:
    - checks
    - linux-x64
    uses: ./.github/workflows/91-build-platform.yml
    with:
      platform: win-x64
      runner_labels: '["self-hosted", "Windows", "X64"]'
      resource_group: sessionprep-x64-host
      version: ${{ needs.checks.outputs.version }}
      sha: ${{ needs.checks.outputs.sha }}
      debug: ${{ inputs.debug }}
  linux-arm64:
    needs:
    - checks
    uses: ./.github/workflows/91-build-platform.yml
    with:
      platform: linux-arm64
      runner_labels: '["self-hosted", "Linux", "ARM64", "jammy", "docker"]'
      resource_group: sessionprep-apple-silicon-host
      version: ${{ needs.checks.outputs.version }}
      sha: ${{ needs.checks.outputs.sha }}
      debug: ${{ inputs.debug }}
  windows-arm64:
    needs:
    - checks
    - linux-arm64
    uses: ./.github/workflows/91-build-platform.yml
    with:
      platform: win-arm64
      runner_labels: '["self-hosted", "Windows", "ARM64"]'
      resource_group: sessionprep-apple-silicon-host
      version: ${{ needs.checks.outputs.version }}
      sha: ${{ needs.checks.outputs.sha }}
      debug: ${{ inputs.debug }}
  macos:
    needs:
    - checks
    - windows-arm64
    uses: ./.github/workflows/92-build-macos.yml
    with:
      version: ${{ needs.checks.outputs.version }}
      sha: ${{ needs.checks.outputs.sha }}
      debug: ${{ inputs.debug }}
      notarize_macos: ${{ inputs.notarize_macos }}
      architecture: both
    secrets:
      MACOS_DEV_ID_CERT_NAME: ${{ secrets.MACOS_DEV_ID_CERT_NAME }}
  windows-installer:
    needs:
    - checks
    - windows-x64
    - windows-arm64
    uses: ./.github/workflows/93-windows-bundle.yml
    with:
      version: ${{ needs.checks.outputs.version }}
      sha: ${{ needs.checks.outputs.sha }}
      debug: ${{ inputs.debug }}
  release:
    name: Collect verified artifacts and replace owned draft
    if: ${{ !inputs.debug }}
    needs:
    - checks
    - windows-installer
    - macos
    runs-on:
    - self-hosted
    - Linux
    - X64
    - jammy
    - docker
    concurrency:
      group: sessionprep-x64-host
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_DIR: src-${{ github.run_id }}-${{ github.run_attempt }}-release
      BUILD_VERSION: ${{ needs.checks.outputs.version }}
      SOURCE_SHA: ${{ needs.checks.outputs.sha }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
    steps:
    - name: Checkout exact build commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        path: ${{ env.SOURCE_DIR }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      with:
        # Self-hosted runners keep uv's local cache. The remote cache only held
        # a pruned copy, and saving it pruned downloaded wheels locally.
        enable-cache: false
    - name: Download artifacts from this run
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: sessionprep-*-release
        path: ${{ env.SOURCE_DIR }}/downloaded-artifacts
    - name: Validate all release deliverables
      shell: bash
      run: |
        set -euo pipefail
        cd "$SOURCE_DIR"
        uv sync --frozen --no-default-groups
        uv run --frozen --no-default-groups python packaging/github/build.py collect --artifact-root downloaded-artifacts --version "$BUILD_VERSION" --sha "$SOURCE_SHA" --output release-assets
      env:
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/sessionprep-env-${{ github.run_id }}-${{ github.run_attempt }}-release
    - name: Replace only owned unpublished draft
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      run: |
        set -euo pipefail
        cd "$SOURCE_DIR"
        mode=branch
        title="SessionPrep preview: $REF_NAME"
        if [[ "$REF_TYPE" == "tag" ]]; then mode=tag; title="SessionPrep $REF_NAME"; fi
        bash packaging/github/publish-draft-release.sh --artifact-root release-assets --staging-dir staged-release --mode "$mode" --ref-name "$REF_NAME" --target "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" --release-title "$title" --producer-run-id "$GITHUB_RUN_ID"
    - name: Clean only run-owned workspace
      if: ${{ always() }}
      shell: bash
      run: |
        "${CI_PYTHON:-python}" - <<'PY'
        import json, os, pathlib, shutil, stat
        workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
        temporary = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()
        run = os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
        def remove_readonly(function, path, error):
            if not isinstance(error, PermissionError):
                raise error
            os.chmod(path, stat.S_IWRITE)
            function(path)
        for name in json.loads(os.environ["CLEANUP_NAMES"]):
            for parent, child in ((workspace, "src-" + run + "-" + name), (temporary, "sessionprep-env-" + run + "-" + name)):
                target = (parent / child).resolve()
                if target.parent != parent:
                    raise RuntimeError("Cleanup target escaped the run workspace")
                if target.exists():
                    shutil.rmtree(target, onexc=remove_readonly)
        PY
      env:
        CLEANUP_NAMES: '["release"]'
