name: Build (Nuitka)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            suffix: linux-x64
          - os: ubuntu-24.04-arm
            name: Linux arm64
            suffix: linux-arm64
          - os: macos-15
            name: macOS Apple arm64
            suffix: macos-arm64
          - os: macos-15-intel
            name: macOS x64
            suffix: macos-x64
          - os: windows-latest
            name: Windows x64
            suffix: win-x64
          - os: windows-11-arm
            name: Windows arm64
            suffix: win-arm64

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc patchelf ccache

      - name: Install CCache (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache

      - name: Cache Nuitka & CCache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/Nuitka
            ~/AppData/Local/Nuitka/Nuitka/Cache
            ~/Library/Caches/Nuitka
            ~/.cache/ccache
            ~/Library/Caches/ccache
            ~/AppData/Local/ccache
          key: ${{ runner.os }}-${{ matrix.suffix }}-nuitka-${{ hashFiles('**/uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.suffix }}-nuitka-${{ hashFiles('**/uv.lock') }}-
            ${{ runner.os }}-${{ matrix.suffix }}-nuitka-

      - name: Install Dependencies
        run: uv sync --extra cli --extra gui

      - name: Disable Windows Defender for build directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $PWD

      - name: Build with Nuitka
        run: uv run python build_nuitka.py all

      # -----------------------------------------------------------------------
      # Determine version (used by all packaging steps)
      # -----------------------------------------------------------------------
      - name: Determine version
        id: version
        shell: bash
        run: |
          VER=$(uv run python -c "from build_conf import get_version; print(get_version(strict=True))")
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Linux packaging
      # -----------------------------------------------------------------------
      - name: Package Linux Distributions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -q && sudo apt-get install -y nfpm

          VERSION="${{ steps.version.outputs.ver }}"
          SUFFIX="${{ matrix.suffix }}"
          # Map matrix suffix to nfpm arch (deb/rpm format)
          case "$SUFFIX" in
            linux-x64)   NFPM_ARCH=amd64 ;;
            linux-arm64) NFPM_ARCH=arm64 ;;
            *)           NFPM_ARCH=amd64 ;;
          esac
          export VERSION SUFFIX NFPM_ARCH DIST_DIR=dist_nuitka

          # Merge GUI dist into CLI dist so we have a single unified distribution directory
          # This prevents nfpm from throwing "content collision" errors
          cp -a dist_nuitka/sessionprep-gui.dist/. dist_nuitka/sessionprep.dist/

          TMPCONFIG=$(mktemp --suffix=.yaml)
          envsubst < packaging/linux/nfpm.yaml > "$TMPCONFIG"
          nfpm package --config "$TMPCONFIG" --packager deb --target dist_nuitka/
          nfpm package --config "$TMPCONFIG" --packager rpm --target dist_nuitka/
          rm "$TMPCONFIG"

          STAGING=$(mktemp -d)
          cp -r dist_nuitka/sessionprep.dist         "$STAGING/sessionprep.dist"
          cp sessionprepgui/res/sessionprep.png      "$STAGING/sessionprep.png"
          cp packaging/linux/sessionprep.desktop     "$STAGING/sessionprep.desktop"
          cp packaging/linux/install-sessionprep.sh  "$STAGING/install-sessionprep.sh"
          chmod +x "$STAGING/install-sessionprep.sh"
          tar -czf "dist_nuitka/sessionprep-${VERSION}-${{ matrix.suffix }}.tar.gz" \
            -C "$STAGING" \
            sessionprep.dist \
            sessionprep.png \
            sessionprep.desktop install-sessionprep.sh

      # -----------------------------------------------------------------------
      # Windows packaging
      # -----------------------------------------------------------------------
      - name: Build InnoSetup Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.ver }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAPP_VERSION=$ver" `
            "/DDIST_DIR=dist_nuitka" `
            "/DARCH_SUFFIX=${{ matrix.suffix }}" `
            "packaging\windows\sessionprep.iss"

      # -----------------------------------------------------------------------
      # macOS packaging
      # -----------------------------------------------------------------------
      - name: Import macOS Code Signing Certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v5.0.3
        with:
          p12-file-base64: ${{ secrets.P12_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Sign macOS .app bundle
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_DEV_ID_CERT_NAME: ${{ secrets.MACOS_DEV_ID_CERT_NAME }}
        run: |
          if [ -z "$MACOS_DEV_ID_CERT_NAME" ]; then
            echo "MACOS_DEV_ID_CERT_NAME secret is required for macOS signing." >&2
            exit 1
          fi

          APP_PATH="dist_nuitka/SessionPrep.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle not found: $APP_PATH" >&2
            exit 1
          fi

          packaging/macos/appbundle-sign.sh \
            -a "$APP_PATH" \
            -c "$MACOS_DEV_ID_CERT_NAME"

      - name: Package macOS development DMG
        if: runner.os == 'macOS' && github.ref_type != 'tag'
        shell: bash
        run: |
          brew install create-dmg
          VERSION="${{ steps.version.outputs.ver }}"
          APP_PATH="dist_nuitka/SessionPrep.app"
          APP_NAME=$(basename "$APP_PATH" .app)
          DMG_PATH="dist_nuitka/sessionprep-${VERSION}-${{ matrix.suffix }}.dmg"

          STAGING=$(mktemp -d)
          trap 'rm -rf "$STAGING"' EXIT
          ditto "$APP_PATH" "$STAGING/$(basename "$APP_PATH")"
          create-dmg \
            --volname "$APP_NAME" \
            --app-drop-link 600 185 \
            --sandbox-safe \
            "$DMG_PATH" \
            "$STAGING"
          rm -f dist_nuitka/rw.*.dmg

      - name: Notarize and package macOS release DMG
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        env:
          MACOS_DEV_ID_CERT_NAME: ${{ secrets.MACOS_DEV_ID_CERT_NAME }}
          APPLE_NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
          APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${{ steps.version.outputs.ver }}"
          APP_PATH="dist_nuitka/SessionPrep.app"
          FINAL_DMG="dist_nuitka/sessionprep-${VERSION}-${{ matrix.suffix }}.dmg"

          packaging/macos/appbundle-release.sh -a "$APP_PATH"
          if [ ! -f "SessionPrep.dmg" ]; then
            echo "Expected notarized DMG not found: SessionPrep.dmg" >&2
            exit 1
          fi
          mv "SessionPrep.dmg" "$FINAL_DMG"

      # -----------------------------------------------------------------------
      # Upload
      # -----------------------------------------------------------------------
      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sessionprep-${{ matrix.suffix }}
          path: |
            dist_nuitka/sessionprep-*.*
            dist_nuitka/sessionprep_*.*
            !dist_nuitka/sessionprep-*.build
            !dist_nuitka/sessionprep-*.build/**
            !dist_nuitka/sessionprep-*.dist
            !dist_nuitka/sessionprep-*.dist/**
          if-no-files-found: error
