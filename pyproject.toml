[project]
name = "sessionprep"
dynamic = ["version"]
description = "Batch audio analyzer and normalizer for mix session preparation"
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.13,<3.14"

dependencies = [
    "numpy>=1.26",
    "packaging>=24",
    # 0.14 adds Windows ARM64 wheels with bundled libsndfile.
    "soundfile>=0.14.0",
    "scipy>=1.12",
]

[project.scripts]
sessionprep = "sessionprep:process_files"

[build-system]
requires = ["setuptools>=69", "wheel", "packaging>=24"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sessionprep"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sessionpreplib*", "sessionprepgui*"]

[tool.setuptools.package-data]
sessionprepgui = ["res/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",   # line length handled conservatively
    "B905",   # zip() strict= not mandatory everywhere in legacy code
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
files = [
    "sessionpreplib/paths.py",
    "sessionpreplib/models.py",
    "sessionpreplib/gain_staging.py",
    "sessionpreplib/topology.py",
    "sessionpreplib/file_io.py",
    "sessionpreplib/layout_files.py",
    "sessionpreplib/repairs.py",
    "sessionpreplib/config.py",
    "sessionpreplib/summary.py",
    "sessionpreplib/pipeline.py",
    "sessionpreplib/audio.py",
    "sessionpreplib/repair_plan.py",
    "sessionpreplib/repair_verification.py",
    "sessionpreplib/detector.py",
    "sessionpreplib/processor.py",
    "sessionpreplib/rendering.py",
    "sessionpreplib/queue.py",
    "sessionpreplib/events.py",
    "sessionpreplib/utils.py",
    "sessionpreplib/reports.py",
    "sessionpreplib/signal_flow/__init__.py",
    "sessionpreplib/signal_flow/models.py",
    "sessionpreplib/signal_flow/trim_codecs.py",
    "sessionpreplib/signal_flow/math.py",
    "sessionpreplib/signal_flow/analysis.py",
    "sessionpreplib/signal_flow/solver.py",
    "sessionpreplib/ptx/__init__.py",
    "sessionpreplib/ptx/models.py",
    "sessionpreplib/ptx/codec.py",
    "sessionpreplib/ptx/parser.py",
    "sessionpreplib/ptx/parser_mixer.py",
    "sessionpreplib/ptx/parser_timeline.py",
    "sessionpreplib/ptx/timeline.py",
    "sessionpreplib/ptx/arrangement.py",
    "sessionpreplib/ptx/queries.py",
    "sessionpreplib/ptx/plugin_controls.py",
    "sessionpreplib/ptx/patch_builder.py",
    "sessionpreplib/ptx/writer_primitives.py",
    "sessionpreplib/ptx/writer_chunks.py",
    "sessionpreplib/ptx/patcher.py",
    "sessionpreplib/ptx/signal_flow.py",
    "sessionpreplib/ptx/signal_flow_analysis.py",
    "sessionpreplib/daw_processors/protools_ptx.py",
    "sessionpreplib/daw_processors/protools_ptx_media.py",
    "sessionpreplib/daw_processors/protools_ptx_plan.py",
    "sessionpreplib/daw_processors/protools_ptx_preview.py",
    "sessionpreplib/daw_processors/dawproject_vst3.py",
    "sessionpreplib/daw_processors/dawproject_signal_flow.py",
    "sessionpreplib/daw_processors/dawproject.py",
    "sessionprepgui/state.py",
    "sessionprepgui/shell.py",
    "sessionprepgui/progress.py",
    "sessionprepgui/mainwindow.py",
    "sessionprepgui/batch/controller.py",
    "sessionprepgui/batch/manager.py",
    "sessionprepgui/topology/page.py",
    "sessionprepgui/topology/controller.py",
    "sessionprepgui/daw/page.py",
    "sessionprepgui/daw/controller.py",
    "sessionprepgui/daw/signal_flow_panel.py",
