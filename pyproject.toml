[project]
name = "sessionprep"
dynamic = ["version"]
description = "Batch audio analyzer and normalizer for mix session preparation"
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.13,<3.14"

dependencies = [
    "numpy>=1.26",
    "packaging>=24",
    # 0.14 adds Windows ARM64 wheels with bundled libsndfile.
    "soundfile>=0.14.0",
    "scipy>=1.12",
]

[project.scripts]
sessionprep = "sessionprep:process_files"

[build-system]
requires = ["setuptools>=69", "wheel", "packaging>=24"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sessionprep"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sessionpreplib*", "sessionprepgui*"]

[tool.setuptools.package-data]
sessionprepgui = ["res/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",   # line length handled conservatively
    "B905",   # zip() strict= not mandatory everywhere in legacy code
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
files = [
    "sessionpreplib/paths.py",
    "sessionpreplib/models.py",
    "sessionpreplib/gain_staging.py",
    "sessionpreplib/topology.py",
    "sessionpreplib/file_io.py",
    "sessionpreplib/layout_files.py",
    "sessionpreplib/repairs.py",
    "sessionpreplib/config.py",
    "sessionpreplib/summary.py",
    "sessionprepgui/state.py",
    "sessionprepgui/shell.py",
    "sessionprepgui/topology/page.py",
    "sessionprepgui/topology/controller.py",
    "sessionprepgui/daw/page.py",
    "sessionprepgui/daw/controller.py",
    "sessionprepgui/detail/controller.py",
    "sessionprepgui/detail/repair_preview.py",
    "sessionprepgui/tracks/table_controller.py",
    "sessionprepgui/tracks/groups_tab.py",
    "sessionprepgui/tracks/groups_controller.py",
    "sessionprepgui/analysis/config_controller.py",
    "sessionprepgui/analysis/lifecycle_controller.py",
]

[project.optional-dependencies]
cli = ["rich>=13.0"]
gui = [
    "PySide6>=6.10.2",
    "sounddevice>=0.5.5",
    "dawproject @ https://github.com/roex-audio/dawproject-py/archive/70e65aeb7b260cfec3871ca89ca8d80022c44496.zip",
    # FIXME: grpcio has no ARM64 Windows wheel and cannot be compiled from
    # source with MSVC on ARM64 (grpc/grpc#39362, grpc/grpc#39624).
    # Remove the platform_machine marker once grpcio publishes win_arm64 wheels.
    "py-ptsl>=600.2.0; platform_machine != 'ARM64'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "nuitka>=4.0",
    "zstandard>=0.25.0",
    "rich>=13.0",
    "patchelf>=0.17.2.4; sys_platform != 'win32'",
    "pylint>=4.0.5",
    "pyyaml>=6.0",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
]
